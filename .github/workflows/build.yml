name: APK bauen
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Projekt erzeugen
        run: |
          mkdir -p proj && cd proj
          mkdir -p $(dirname settings.gradle.kts)
          cat > settings.gradle.kts <<'EOF_ZENSUR'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Zensur"
          include(":app")
          EOF_ZENSUR
          mkdir -p $(dirname build.gradle.kts)
          cat > build.gradle.kts <<'EOF_ZENSUR'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_ZENSUR
          mkdir -p $(dirname gradle.properties)
          cat > gradle.properties <<'EOF_ZENSUR'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF_ZENSUR
          mkdir -p $(dirname app/build.gradle.kts)
          cat > app/build.gradle.kts <<'EOF_ZENSUR'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "de.zensur"
              compileSdk = 34
              defaultConfig {
                  applicationId = "de.zensur"
                  minSdk = 30
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              androidResources { noCompress += "onnx" }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              implementation("com.microsoft.onnxruntime:onnxruntime-android:1.17.3")
          }
          EOF_ZENSUR
          mkdir -p $(dirname app/src/main/AndroidManifest.xml)
          cat > app/src/main/AndroidManifest.xml <<'EOF_ZENSUR'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:label="Zensur"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".CensorService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />
              </application>
          </manifest>
          EOF_ZENSUR
          mkdir -p $(dirname app/src/main/java/de/zensur/MainActivity.kt)
          cat > app/src/main/java/de/zensur/MainActivity.kt <<'EOF_ZENSUR'
          package de.zensur

          import android.Manifest
          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {

              private lateinit var status: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(48, 48, 48, 48)
                  }
                  status = TextView(this).apply { textSize = 16f; gravity = Gravity.CENTER }
                  val start = Button(this).apply { text = "Zensur starten"; setOnClickListener { startFlow() } }
                  val stop = Button(this).apply {
                      text = "Zensur stoppen"
                      setOnClickListener {
                          stopService(Intent(this@MainActivity, CensorService::class.java))
                          status.text = "Gestoppt."
                      }
                  }
                  root.addView(status); root.addView(start); root.addView(stop)
                  setContentView(root)
                  status.text = "Brüste und Vagina werden mit Balken verdeckt, alles läuft nur lokal auf dem Handy."
                  if (checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != android.content.pm.PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)
                  }
              }

              private fun startFlow() {
                  if (!Settings.canDrawOverlays(this)) {
                      status.text = "Bitte \"Über anderen Apps einblenden\" für Zensur erlauben, dann zurück und nochmal starten."
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                      return
                  }
                  val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  startActivityForResult(mpm.createScreenCaptureIntent(), 42)
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 42 && resultCode == RESULT_OK && data != null) {
                      val i = Intent(this, CensorService::class.java)
                          .putExtra("code", resultCode)
                          .putExtra("data", data)
                      startForegroundService(i)
                      status.text = "Läuft. Du kannst die App jetzt verlassen."
                  } else if (requestCode == 42) {
                      status.text = "Bildschirmaufnahme wurde nicht erlaubt."
                  }
              }
          }
          EOF_ZENSUR
          mkdir -p $(dirname app/src/main/java/de/zensur/BarView.kt)
          cat > app/src/main/java/de/zensur/BarView.kt <<'EOF_ZENSUR'
          package de.zensur

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.RectF
          import android.view.View

          class BarView(context: Context) : View(context) {
              private val paint = Paint().apply { color = Color.BLACK; style = Paint.Style.FILL }
              @Volatile private var rects: List<RectF> = emptyList()

              fun setRects(r: List<RectF>) {
                  rects = r
                  postInvalidateOnAnimation()
              }

              override fun onDraw(canvas: Canvas) {
                  for (r in rects) canvas.drawRect(r, paint)
              }
          }
          EOF_ZENSUR
          mkdir -p $(dirname app/src/main/java/de/zensur/Detector.kt)
          cat > app/src/main/java/de/zensur/Detector.kt <<'EOF_ZENSUR'
          package de.zensur

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.RectF
          import ai.onnxruntime.OnnxTensor
          import ai.onnxruntime.OrtEnvironment
          import ai.onnxruntime.OrtSession
          import java.nio.FloatBuffer

          /** NudeNet 320n. Zensiert nur FEMALE_BREAST_EXPOSED (3) und FEMALE_GENITALIA_EXPOSED (4). */
          class Detector(context: Context) {
              private val env = OrtEnvironment.getEnvironment()
              private val session: OrtSession
              private val inputName: String
              private val size = 320
              private val targets = setOf(3, 4)
              private val threshold = 0.30f

              init {
                  val bytes = context.assets.open("320n.onnx").use { it.readBytes() }
                  session = env.createSession(bytes, OrtSession.SessionOptions().apply { setIntraOpNumThreads(4) })
                  inputName = session.inputNames.first()
              }

              /** Liefert Rechtecke in Bitmap-Koordinaten. Das Bild wird in quadratische, überlappende Kacheln zerlegt. */
              fun detect(bmp: Bitmap): List<RectF> {
                  val w = bmp.width
                  val h = bmp.height
                  val side = minOf(w, h)
                  val step = maxOf(1, side / 2)
                  val longSide = maxOf(w, h)
                  val offsets = ArrayList<Int>()
                  var p = 0
                  while (p + side < longSide) { offsets.add(p); p += step }
                  offsets.add(longSide - side)

                  val found = ArrayList<Pair<RectF, Float>>()
                  for (o in offsets.distinct()) {
                      val x0 = if (w > h) o else 0
                      val y0 = if (h >= w) o else 0
                      val tile = Bitmap.createBitmap(bmp, x0, y0, side, side)
                      val scaled = Bitmap.createScaledBitmap(tile, size, size, true)
                      if (tile !== bmp) tile.recycle()
                      runTile(scaled, side.toFloat() / size, x0.toFloat(), y0.toFloat(), found)
                      scaled.recycle()
                  }
                  return nms(found)
              }

              private fun runTile(b: Bitmap, scale: Float, ox: Float, oy: Float, out: MutableList<Pair<RectF, Float>>) {
                  val px = IntArray(size * size)
                  b.getPixels(px, 0, size, 0, 0, size, size)
                  val data = FloatArray(3 * size * size)
                  val plane = size * size
                  for (i in px.indices) {
                      val c = px[i]
                      data[i] = ((c shr 16) and 0xFF) / 255f
                      data[plane + i] = ((c shr 8) and 0xFF) / 255f
                      data[2 * plane + i] = (c and 0xFF) / 255f
                  }
                  val tensor = OnnxTensor.createTensor(env, FloatBuffer.wrap(data), longArrayOf(1, 3, size.toLong(), size.toLong()))
                  tensor.use {
                      session.run(mapOf(inputName to tensor)).use { res ->
                          @Suppress("UNCHECKED_CAST")
                          val o = (res[0].value as Array<Array<FloatArray>>)[0] // [22][N]
                          val n = o[0].size
                          for (i in 0 until n) {
                              var best = -1
                              var bs = 0f
                              for (c in 0 until 18) {
                                  val s = o[4 + c][i]
                                  if (s > bs) { bs = s; best = c }
                              }
                              if (best in targets && bs >= threshold) {
                                  val cx = o[0][i]; val cy = o[1][i]; val bw = o[2][i]; val bh = o[3][i]
                                  out.add(
                                      RectF(
                                          ox + (cx - bw / 2) * scale, oy + (cy - bh / 2) * scale,
                                          ox + (cx + bw / 2) * scale, oy + (cy + bh / 2) * scale
                                      ) to bs
                                  )
                              }
                          }
                      }
                  }
              }

              private fun nms(list: List<Pair<RectF, Float>>): List<RectF> {
                  val sorted = list.sortedByDescending { it.second }
                  val keep = ArrayList<RectF>()
                  for ((r, _) in sorted) {
                      if (keep.none { iou(it, r) > 0.45f }) keep.add(r)
                  }
                  return keep
              }

              private fun iou(a: RectF, b: RectF): Float {
                  val l = maxOf(a.left, b.left); val t = maxOf(a.top, b.top)
                  val r = minOf(a.right, b.right); val bt = minOf(a.bottom, b.bottom)
                  val inter = maxOf(0f, r - l) * maxOf(0f, bt - t)
                  val u = a.width() * a.height() + b.width() * b.height() - inter
                  return if (u <= 0f) 0f else inter / u
              }
          }
          EOF_ZENSUR
          mkdir -p $(dirname app/src/main/java/de/zensur/CensorService.kt)
          cat > app/src/main/java/de/zensur/CensorService.kt <<'EOF_ZENSUR'
          package de.zensur

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Bitmap
          import android.graphics.PixelFormat
          import android.graphics.RectF
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.Image
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.SystemClock
          import android.view.Gravity
          import android.view.WindowManager
          import kotlin.math.abs

          class CensorService : Service() {

              private var projection: MediaProjection? = null
              private var display: VirtualDisplay? = null
              private var reader: ImageReader? = null
              private var overlay: BarView? = null
              private var overlayParams: WindowManager.LayoutParams? = null
              private var worker: Thread? = null
              @Volatile private var running = false
              private val main = Handler(Looper.getMainLooper())

              private var screenW = 0
              private var screenH = 0
              private var capW = 0
              private var capH = 0

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (running || intent == null) return START_NOT_STICKY
                  startInForeground()

                  val code = intent.getIntExtra("code", 0)
                  @Suppress("DEPRECATION")
                  val data = intent.getParcelableExtra<Intent>("data")
                  if (data == null) { stopSelf(); return START_NOT_STICKY }

                  val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  val proj = mpm.getMediaProjection(code, data)
                  projection = proj
                  proj.registerCallback(object : MediaProjection.Callback() {
                      override fun onStop() { stopSelf() }
                  }, main)

                  val wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  val b = wm.maximumWindowMetrics.bounds
                  screenW = b.width(); screenH = b.height()
                  val scale = minOf(1f, 720f / minOf(screenW, screenH))
                  capW = (screenW * scale).toInt(); capH = (screenH * scale).toInt()

                  val r = ImageReader.newInstance(capW, capH, PixelFormat.RGBA_8888, 3)
                  reader = r
                  display = proj.createVirtualDisplay(
                      "zensur", capW, capH, resources.displayMetrics.densityDpi,
                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, r.surface, null, null
                  )

                  val view = BarView(this)
                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS
                  }
                  wm.addView(view, lp)
                  overlay = view
                  overlayParams = lp

                  running = true
                  worker = Thread { loop() }.also { it.start() }
                  return START_NOT_STICKY
              }

              private fun startInForeground() {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("zensur", "Zensur", NotificationManager.IMPORTANCE_LOW))
                  val n = Notification.Builder(this, "zensur")
                      .setContentTitle("Zensur läuft")
                      .setSmallIcon(android.R.drawable.ic_menu_view)
                      .build()
                  startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
              }

              private fun setOverlayAlpha(a: Float) {
                  main.post {
                      val v = overlay ?: return@post
                      val lp = overlayParams ?: return@post
                      lp.alpha = a
                      try {
                          (getSystemService(Context.WINDOW_SERVICE) as WindowManager).updateViewLayout(v, lp)
                      } catch (_: Exception) {}
                  }
              }

              private fun loop() {
                  val detector = Detector(this)
                  var bars: List<RectF> = emptyList() // Koordinaten im Aufnahmebild
                  var lastProbe = 0L
                  var prevSig: IntArray? = null
                  val r = reader ?: return

                  while (running) {
                      try {
                          val now = SystemClock.uptimeMillis()
                          var frame: Bitmap? = null

                          if (bars.isNotEmpty()) {
                              // Balken sind sichtbar und werden mit aufgenommen. Bewegt sich der Rest des Bildes
                              // oder ist Zeit vergangen, wird kurz ein Probebild ohne Balken gemacht.
                              var changed = false
                              r.acquireLatestImage()?.let { img ->
                                  val b = toBitmap(img); img.close()
                                  val sig = signature(b, bars)
                                  val p = prevSig
                                  changed = p != null && diff(sig, p) > 6
                                  prevSig = sig
                                  b.recycle()
                              }
                              val due = now - lastProbe > 700 || (changed && now - lastProbe > 200)
                              if (due) {
                                  lastProbe = now
                                  setOverlayAlpha(0f)
                                  Thread.sleep(60)
                                  val img = r.acquireLatestImage()
                                  setOverlayAlpha(1f)
                                  if (img != null) { frame = toBitmap(img); img.close() }
                              }
                          } else {
                              val img = r.acquireLatestImage()
                              if (img != null) { frame = toBitmap(img); img.close() }
                              prevSig = null
                          }

                          if (frame != null) {
                              val stale = bars.isNotEmpty() && looksStale(frame, bars)
                              if (!stale) {
                                  val found = detector.detect(frame)
                                  bars = found.map { pad(it) }
                                  pushBars(bars)
                                  prevSig = null
                                  lastProbe = SystemClock.uptimeMillis()
                              }
                              frame.recycle()
                          }
                          Thread.sleep(40)
                      } catch (e: InterruptedException) {
                          break
                      } catch (e: Exception) {
                          Thread.sleep(200)
                      }
                  }
              }

              private fun pad(r: RectF): RectF {
                  val px = r.width() * 0.12f
                  val py = r.height() * 0.12f
                  return RectF(
                      maxOf(0f, r.left - px), maxOf(0f, r.top - py),
                      minOf(capW.toFloat(), r.right + px), minOf(capH.toFloat(), r.bottom + py)
                  )
              }

              private fun pushBars(bars: List<RectF>) {
                  val sx = screenW.toFloat() / capW
                  val sy = screenH.toFloat() / capH
                  val scaled = bars.map { RectF(it.left * sx, it.top * sy, it.right * sx, it.bottom * sy) }
                  overlay?.setRects(scaled)
              }

              private fun toBitmap(img: Image): Bitmap {
                  val plane = img.planes[0]
                  val rowW = plane.rowStride / plane.pixelStride
                  val full = Bitmap.createBitmap(rowW, img.height, Bitmap.Config.ARGB_8888)
                  full.copyPixelsFromBuffer(plane.buffer)
                  if (rowW == img.width) return full
                  val cropped = Bitmap.createBitmap(full, 0, 0, img.width, img.height)
                  full.recycle()
                  return cropped
              }

              /** Grobe Helligkeits-Signatur des Bildes ohne die Balkenflächen (-1 = ausgelassen). */
              private fun signature(b: Bitmap, bars: List<RectF>): IntArray {
                  val gx = 16; val gy = 32
                  val out = IntArray(gx * gy)
                  for (j in 0 until gy) for (i in 0 until gx) {
                      val x = (i + 0.5f) * b.width / gx
                      val y = (j + 0.5f) * b.height / gy
                      out[j * gx + i] = if (bars.any { it.contains(x, y) }) -1 else lum(b.getPixel(x.toInt(), y.toInt()))
                  }
                  return out
              }

              private fun diff(a: IntArray, b: IntArray): Int {
                  var sum = 0L; var n = 0
                  for (i in a.indices) if (a[i] >= 0 && b[i] >= 0) { sum += abs(a[i] - b[i]); n++ }
                  return if (n == 0) 0 else (sum / n).toInt()
              }

              private fun lum(c: Int): Int = (((c shr 16) and 0xFF) * 3 + ((c shr 8) and 0xFF) * 6 + (c and 0xFF)) / 10

              /** Zeigt das Probebild unter den alten Balken nur Schwarz, war der Balken noch drin. */
              private fun looksStale(b: Bitmap, bars: List<RectF>): Boolean {
                  var sum = 0L; var n = 0
                  for (r in bars) {
                      val x0 = r.left.toInt().coerceIn(0, b.width - 1); val x1 = r.right.toInt().coerceIn(x0 + 1, b.width)
                      val y0 = r.top.toInt().coerceIn(0, b.height - 1); val y1 = r.bottom.toInt().coerceIn(y0 + 1, b.height)
                      for (j in 0 until 4) for (i in 0 until 4) {
                          sum += lum(b.getPixel(x0 + (x1 - x0) * i / 4, y0 + (y1 - y0) * j / 4)); n++
                      }
                  }
                  return n > 0 && sum / n < 6
              }

              override fun onDestroy() {
                  running = false
                  worker?.interrupt()
                  try { overlay?.let { (getSystemService(Context.WINDOW_SERVICE) as WindowManager).removeView(it) } } catch (_: Exception) {}
                  display?.release()
                  reader?.close()
                  projection?.stop()
                  super.onDestroy()
              }
          }
          EOF_ZENSUR
          mkdir -p app/src/main/assets
          pip download nudenet==3.4.2 --no-deps -d /tmp/nn
          unzip -oq /tmp/nn/*.whl 'nudenet/320n.onnx' -d /tmp/nn/x
          cp /tmp/nn/x/nudenet/320n.onnx app/src/main/assets/320n.onnx
      - name: Bauen
        working-directory: proj
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Zensur-APK
          path: proj/app/build/outputs/apk/debug/app-debug.apk
